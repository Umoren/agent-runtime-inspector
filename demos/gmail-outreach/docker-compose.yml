services:
  opa:
    image: openpolicyagent/opa:1.18.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/policy.rego", "/policy/policy-data.json"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./opa/policy.rego:/policy/policy.rego:ro
      - ./opa/policy-data.json:/policy/policy-data.json:ro
